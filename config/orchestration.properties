# ── Critical Path ─────────────────────────────────────────────────────────
# Comma-separated workflow names that are always treated as business-critical.
# These always get CRITICAL priority regardless of current health.
orchestration.critical.workflows=Authentication,Login,AppPairing,Checkout,Publishing,ConnectWorkflow

# ── Retry Limits ──────────────────────────────────────────────────────────
orchestration.retry.max.flaky=2
orchestration.retry.max.environment=1
orchestration.retry.max.product_bug=0
orchestration.retry.max.automation_bug=1
orchestration.retry.max.unknown=1

# ── Suite Minimization ────────────────────────────────────────────────────
# Stability score above which a suite is a candidate for reduced sampling
orchestration.minimization.stable.threshold=85
# Minimum sampling fraction when minimizing (never go below this)
orchestration.minimization.min.sample.fraction=0.50

# ── Resource Allocation ───────────────────────────────────────────────────
# Number of isolated executors reserved for critical/high-risk suites
orchestration.resource.isolated.pool.size=2
orchestration.resource.shared.pool.size=4

# ── Risk Prediction ───────────────────────────────────────────────────────
# Degradation % above which a workflow is flagged HIGH risk
orchestration.risk.degradation.threshold=30.0
# Stability score below which a workflow is flagged HIGH risk
orchestration.risk.stability.threshold=65

# ── Orchestration Mode ────────────────────────────────────────────────────
# advisory = recommendations only, never auto-applies
# The only valid value in Phase C.2. Do not change to automated.
orchestration.mode=advisory
